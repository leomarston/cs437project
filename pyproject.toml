[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "solid-analyzer"
version = "1.0.0"
description = "Automated SOLID violation detection and refactoring framework using Gemini LLM"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "gitpython>=3.1.0",
    "pyyaml>=6.0",
    "radon>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
solid-analyzer = "solid_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["solid_analyzer*"]
